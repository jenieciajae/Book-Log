<canvas id="bookCanvas" width="200" height="150"></canvas>
</section>
	


<script>
const canvas = document.getElementById("bookCanvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "#FFB6C1";
ctx.fillRect(60,30,80,100);
ctx.fillStyle = "#ff9bb3";
ctx.fillRect(50,30,10,100);

ctx.strokeStyle = "black";
ctx.lineWidth = 2;
ctx.strokeRect(60,30,80,100);
ctx.strokeStyle = "#666";

ctx.beginPath();
ctx.moveTo(70,50);
ctx.lineTo(130,50);

ctx.moveTo(70,70);
ctx.lineTo(130,70);

ctx.moveTo(70,90);
ctx.lineTo(130,90);

ctx.stroke();

ctx.fillStyle = "black";
ctx.font = "14px serif";
ctx.fillText("BOOK",85,115);

</script>
